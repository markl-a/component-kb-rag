- q: gate resistor recommendation for AS60R045
  expect: [AS60R045_datasheet_rev2.md]
  must_contain: "gate resistor"
- q: What interface does NX-PHY100 use?
  expect: [NX-PHY100_datasheet.md]
  must_contain: "RGMII"
- q: What is the price of AS60R045?
  expect: []                    # not in the KB -> must say not found, not invent
  must_contain: "Not found"
